<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ========== 決算日データ（APIから取得、フォールバック用に一部ハードコード） ==========
    // 注: 決算日はFinnhub APIから自動取得されます
    // APIが利用できない場合のフォールバックとして主要銘柄のみハードコード
    const FALLBACK_EARNINGS = {
      'AAPL': { name: 'アップル', nextEarnings: '2026-01-30', time: 'AMC' },
      'MSFT': { name: 'マイクロソフト', nextEarnings: '2026-01-28', time: 'AMC' },
      'GOOGL': { name: 'アルファベット', nextEarnings: '2026-02-04', time: 'AMC' },
      'AMZN': { name: 'アマゾン', nextEarnings: '2026-02-06', time: 'AMC' },
      'NVDA': { name: 'エヌビディア', nextEarnings: '2026-02-26', time: 'AMC' },
      'META': { name: 'メタ', nextEarnings: '2026-01-29', time: 'AMC' },
      'TSLA': { name: 'テスラ', nextEarnings: '2026-01-29', time: 'AMC' },
    };

    // 決算日キャッシュ（6時間有効）
    const EARNINGS_CACHE_TTL = 6 * 60 * 60 * 1000; // 6時間
    
    function getEarningsCache(symbol) {
      try {
        const cached = localStorage.getItem(`earnings_${symbol}`);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < EARNINGS_CACHE_TTL) {
            return data;
          }
        }
      } catch (e) {}
      return null;
    }
    
    function setEarningsCache(symbol, data) {
      try {
        localStorage.setItem(`earnings_${symbol}`, JSON.stringify({
          data,
          timestamp: Date.now()
        }));
      } catch (e) {}
    }

    // 決算日をAPIから取得する関数（キャッシュ付き）
    async function fetchEarningsFromAPI(symbols) {
      if (!symbols || symbols.length === 0) return {};
      
      const results = {};
      const symbolsToFetch = [];
      
      // まずキャッシュをチェック
      symbols.forEach(symbol => {
        const cached = getEarningsCache(symbol);
        if (cached) {
          results[symbol] = cached;
          console.log(`Earnings cache hit: ${symbol}`);
        } else {
          symbolsToFetch.push(symbol);
        }
      });
      
      // キャッシュにない銘柄のみAPIを呼び出し
      if (symbolsToFetch.length === 0) {
        return results;
      }
      
      console.log(`Fetching earnings from API: ${symbolsToFetch.join(', ')}`);
      
      const promises = symbolsToFetch.map(async (symbol) => {
        try {
          const response = await fetch(`/api/earnings?symbol=${encodeURIComponent(symbol)}`);
          
          if (!response.ok) {
            console.warn(`Earnings API error for ${symbol}:`, response.status);
            return { symbol, data: null };
          }
          
          const data = await response.json();
          
          if (data.date) {
            const earningsData = {
              nextEarnings: data.date,
              time: data.hour === 'amc' ? 'AMC' : data.hour === 'bmo' ? 'BMO' : 'TBD',
              epsEstimate: data.epsEstimate,
              revenueEstimate: data.revenueEstimate
            };
            // キャッシュに保存
            setEarningsCache(symbol, earningsData);
            return { symbol, data: earningsData };
          }
          return { symbol, data: null };
        } catch (error) {
          console.warn(`Failed to fetch earnings for ${symbol}:`, error);
          return { symbol, data: null };
        }
      });
      
      const responses = await Promise.all(promises);
      
      responses.forEach(({ symbol, data }) => {
        if (data) {
          results[symbol] = data;
        }
      });
      
      return results;
    }

    // ========== ユーティリティ関数 ==========
    function decodeShiftJIS(buffer) {
      // 複数のエンコーディング名を試す
      const encodings = ['shift_jis', 'Shift_JIS', 'sjis', 'SJIS', 'shift-jis', 'windows-31j'];
      
      for (const encoding of encodings) {
        try {
          const decoder = new TextDecoder(encoding);
          const text = decoder.decode(buffer);
          // 日本語が含まれているか確認（外貨CSV用に「通貨」「残高」も追加）
          if (text.includes('■') || text.includes('ティッカー') || text.includes('銘柄') || text.includes('投資信託') || text.includes('通貨') || text.includes('残高')) {
            console.log('Successful decoding with:', encoding);
            return text;
          }
        } catch (e) {
          console.log('Failed to decode with:', encoding, e.message);
        }
      }
      
      // フォールバック: UTF-8として読み込み
      console.log('Falling back to UTF-8');
      return new TextDecoder('utf-8').decode(buffer);
    }

    function parseNumber(str) {
      if (!str || str === '-') return 0;
      return parseFloat(str.replace(/"/g, '').replace(/,/g, '').trim()) || 0;
    }

    // CSVの1行をパース（ダブルクォート内のカンマに対応）
    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.replace(/"/g, '').trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.replace(/"/g, '').trim());
      return result;
    }

    function detectCSVType(text) {
      if (text.includes('ティッカー') && text.includes('USドル')) return 'US';
      if (text.includes('銘柄コード') && !text.includes('ファンド')) return 'JP';
      if (text.includes('ファンド') || text.includes('投資信託')) return 'FUND';
      // 外貨預り金CSV検出（「参考為替レート」は外貨CSVのみに存在）
      if (text.includes('参考為替レート') && text.includes('残高') && !text.includes('ティッカー')) return 'FOREIGN_CASH';
      return 'UNKNOWN';
    }

    // ========== 外貨預り金解析関数 ==========
    function parseForeignCashCSV(text) {
      console.log('=== parseForeignCashCSV ===');
      const lines = text.split('\n');
      const cashItems = [];
      
      for (const line of lines) {
        // ヘッダー行をスキップ
        if (line.includes('通貨') && line.includes('残高')) continue;
        if (!line.trim()) continue;
        
        const parts = parseCSVLine(line);
        if (parts.length >= 3) {
          const currency = parts[0]; // "米ドル(円換算額)"
          const balanceLocal = parts[1]; // "581.80USD"
          const balanceJPY = parseNumber(parts[2]); // "91,988"
          
          console.log(`Foreign Cash: ${currency}, ${balanceLocal}, ¥${balanceJPY}`);
          
          if (currency && balanceJPY > 0) {
            // 通貨名から通貨コードを抽出
            let currencyCode = 'USD';
            if (currency.includes('米ドル')) currencyCode = 'USD';
            else if (currency.includes('ユーロ')) currencyCode = 'EUR';
            else if (currency.includes('豪ドル')) currencyCode = 'AUD';
            
            cashItems.push({
              type: 'CASH',
              ticker: currencyCode,
              name: currency.replace(/\(.*\)/, '').trim(),
              value: balanceJPY,
              valueCurrency: 'JPY',
              gainPercent: 0,
              balanceLocal: balanceLocal
            });
          }
        }
      }
      console.log('Total foreign cash items:', cashItems.length, 'Total value:', cashItems.reduce((s,x) => s + x.value, 0));
      return cashItems;
    }

    // ========== CSV解析関数 ==========
    function parseUSStockCSV(text) {
      console.log('=== parseUSStockCSV ===');
      const lines = text.split('\n');
      const stocks = [];
      let currentSection = '';

      for (const line of lines) {
        if (line.includes('■特定口座') || line.includes('■NISA')) {
          currentSection = line.includes('NISA') ? 'NISA' : '特定口座';
          console.log('Section:', currentSection);
          continue;
        }
        if (line.startsWith('"') && !line.includes('ティッカー')) {
          const parts = parseCSVLine(line);
          if (parts.length >= 13) {
            const ticker = parts[0];
            const name = parts[1];
            const quantity = parseNumber(parts[3]);
            const avgPrice = parseNumber(parts[8]);
            const currentPrice = parseNumber(parts[10]);
            const dailyChange = parseNumber(parts[11]);
            const value = parseNumber(parts[12]);
            const gainPercent = parseNumber(parts[13]);
            
            console.log(`US Stock: ${ticker}, qty=${quantity}, value=${value}`);

            if (ticker && quantity > 0) {
              stocks.push({
                type: 'US', ticker, name, quantity, avgPrice, currentPrice,
                dailyChange, monthlyChange: null, value, valueCurrency: 'USD',
                gainPercent, section: currentSection, earnings: null
              });
            }
          }
        }
      }
      console.log('Total US stocks:', stocks.length, 'Total value:', stocks.reduce((s,x) => s + x.value, 0));
      return mergeStocks(stocks);
    }

    function parseJPStockCSV(text) {
      console.log('=== parseJPStockCSV ===');
      console.log('Text preview:', text.slice(0, 500));
      const lines = text.split('\n');
      const stocks = [];
      let currentSection = '';
      let isNISASection = false;

      for (const line of lines) {
        if (line.includes('■特定口座')) { 
          currentSection = '特定口座'; 
          isNISASection = false;
          console.log('Section: 特定口座');
          continue; 
        }
        if (line.includes('■NISA')) { 
          currentSection = 'NISA'; 
          isNISASection = true;
          console.log('Section: NISA');
          continue; 
        }
        
        if (line.startsWith('"') && !line.includes('銘柄コード')) {
          const parts = parseCSVLine(line);
          
          // 合計行をスキップ
          if (parts.some(p => p.includes('合計'))) continue;
          
          const code = parts[0];
          const name = parts[1];
          const quantity = parseNumber(parts[2]);
          
          console.log(`JP parsing: code=${code}, name=${name}, parts.length=${parts.length}, isNISA=${isNISASection}`);
          
          let avgPrice, currentPrice, monthlyChange, value, gainPercent;
          
          if (isNISASection && parts.length >= 16) {
            // NISA口座は列が多い（18列）
            avgPrice = parseNumber(parts[8]);
            currentPrice = parseNumber(parts[12]);
            monthlyChange = parseNumber(parts[13]);
            value = parseNumber(parts[14]);
            gainPercent = parseNumber(parts[15]);
            console.log(`  NISA: value=${value} (parts[14]=${parts[14]})`);
          } else if (parts.length >= 10) {
            // 特定口座（12列）
            avgPrice = parseNumber(parts[6]);
            currentPrice = parseNumber(parts[8]);
            monthlyChange = parseNumber(parts[9]);
            value = parseNumber(parts[10]);
            gainPercent = parseNumber(parts[11]);
            console.log(`  特定: value=${value} (parts[10]=${parts[10]})`);
          } else {
            console.log(`  Skipped: parts.length=${parts.length}`);
            continue;
          }

          if (code && quantity > 0 && value > 0) {
            stocks.push({
              type: 'JP', ticker: code, name, quantity, avgPrice, currentPrice,
              dailyChange: null, monthlyChange, value, valueCurrency: 'JPY',
              gainPercent, section: currentSection, earnings: null
            });
          }
        }
      }
      console.log('Total JP stocks:', stocks.length, 'Total value:', stocks.reduce((s,x) => s + x.value, 0));
      return mergeStocks(stocks);
    }

    function parseFundCSV(text) {
      console.log('=== parseFundCSV ===');
      console.log('Text preview:', text.slice(0, 500));
      const lines = text.split('\n');
      const funds = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;
        
        const parts = parseCSVLine(line);
        console.log(`Fund line ${i}: parts.length=${parts.length}`);
        
        if (parts.length >= 15) {
          const section = parts[1];
          const name = parts[2];
          const quantity = parseNumber(parts[4]);
          const avgPrice = parseNumber(parts[7]);
          const currentPrice = parseNumber(parts[9]);
          const dailyChange = parseNumber(parts[10]);
          const monthlyChange = parseNumber(parts[11]);
          const value = parseNumber(parts[12]);
          const gainPercent = parseNumber(parts[14]);
          
          console.log(`  name=${name.slice(0,20)}, qty=${quantity}, value=${value}`);

          if (name && quantity > 0 && value > 0) {
            funds.push({
              type: 'FUND', ticker: name.slice(0, 20), name, quantity, avgPrice, currentPrice,
              dailyChange, monthlyChange, value, valueCurrency: 'JPY',
              gainPercent, section, sections: [section], earnings: null
            });
          }
        } else {
          console.log(`  Skipped: parts.length < 15`);
        }
      }
      console.log('Total funds:', funds.length, 'Total value:', funds.reduce((s,x) => s + x.value, 0));
      return funds;
    }

    function mergeStocks(stocks) {
      const merged = {};
      for (const stock of stocks) {
        if (merged[stock.ticker]) {
          merged[stock.ticker].quantity += stock.quantity;
          merged[stock.ticker].value += stock.value;
          merged[stock.ticker].sections = [...new Set([...merged[stock.ticker].sections, stock.section])];
        } else {
          merged[stock.ticker] = { ...stock, sections: [stock.section] };
        }
      }
      return Object.values(merged);
    }

    // ========== 日本時間変換 ==========
    function convertToJapanTime(usDateStr, timeType) {
      const usDate = new Date(usDateStr + 'T00:00:00');
      if (timeType === 'BMO') return { date: usDate, japanTime: '21:00', calendarTime: '210000' };
      if (timeType === 'AMC') {
        const nextDay = new Date(usDate);
        nextDay.setDate(nextDay.getDate() + 1);
        return { date: nextDay, japanTime: '06:30', calendarTime: '063000' };
      }
      if (timeType === 'JP') return { date: usDate, japanTime: '15:00', calendarTime: '150000' };
      return { date: usDate, japanTime: null, calendarTime: null };
    }

    // ========== ICS生成 ==========
    function generateICS(allStocks, reminderDays = 3) {
      const stocksWithEarnings = allStocks.filter(s => s.earnings?.nextEarnings);
      
      const events = stocksWithEarnings.map(stock => {
        const timeType = stock.earnings.time;
        const japanInfo = convertToJapanTime(stock.earnings.nextEarnings, timeType);
        const dateStr = japanInfo.date.toISOString().split('T')[0].replace(/-/g, '');
        
        let dtStart, dtEnd;
        if (japanInfo.calendarTime) {
          dtStart = `DTSTART;TZID=Asia/Tokyo:${dateStr}T${japanInfo.calendarTime}`;
          const endHour = timeType === 'AMC' ? '073000' : timeType === 'BMO' ? '220000' : '160000';
          dtEnd = `DTEND;TZID=Asia/Tokyo:${dateStr}T${endHour}`;
        } else {
          const nextDay = new Date(japanInfo.date);
          nextDay.setDate(nextDay.getDate() + 1);
          dtStart = `DTSTART;VALUE=DATE:${dateStr}`;
          dtEnd = `DTEND;VALUE=DATE:${nextDay.toISOString().split('T')[0].replace(/-/g, '')}`;
        }

        const marketLabel = stock.type === 'US' ? '🇺🇸' : '🇯🇵';
        const timeNote = timeType === 'BMO' ? '（日本時間21時頃）' : 
                        timeType === 'AMC' ? '（日本時間翌朝6時半頃）' : 
                        timeType === 'JP' ? '（15時頃）' : '';

        return `BEGIN:VEVENT
${dtStart}
${dtEnd}
SUMMARY:📊 ${marketLabel} ${stock.ticker} ${stock.name} 決算${timeNote}
DESCRIPTION:保有数量: ${stock.quantity}${stock.type === 'FUND' ? '口' : '株'}\\n評価額: ${stock.valueCurrency === 'USD' ? '$' : '¥'}${stock.value.toLocaleString()}\\n損益率: ${stock.gainPercent > 0 ? '+' : ''}${stock.gainPercent}%
LOCATION:${stock.ticker}
BEGIN:VALARM
TRIGGER:-P${reminderDays}D
ACTION:DISPLAY
DESCRIPTION:${stock.ticker}の決算発表が${reminderDays}日後です
END:VALARM
END:VEVENT`;
      });

      return `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//楽天証券対応資産管理ツール//JP
CALSCALE:GREGORIAN
METHOD:PUBLISH
X-WR-CALNAME:保有株式決算カレンダー
X-WR-TIMEZONE:Asia/Tokyo
BEGIN:VTIMEZONE
TZID:Asia/Tokyo
BEGIN:STANDARD
TZOFFSETFROM:+0900
TZOFFSETTO:+0900
TZNAME:JST
DTSTART:19700101T000000
END:STANDARD
END:VTIMEZONE
${events.join('\n')}
END:VCALENDAR`;
    }

    // ========== シンプルな円グラフコンポーネント ==========
    function SimplePieChart({ data }) {
      const total = data.reduce((sum, d) => sum + d.value, 0);
      if (total === 0) return null;
      
      let currentAngle = 0;
      const paths = data.map((d, i) => {
        const percentage = d.value / total;
        const angle = percentage * 360;
        const startAngle = currentAngle;
        const endAngle = currentAngle + angle;
        currentAngle = endAngle;
        
        const startRad = (startAngle - 90) * Math.PI / 180;
        const endRad = (endAngle - 90) * Math.PI / 180;
        const largeArc = angle > 180 ? 1 : 0;
        
        const x1 = 100 + 80 * Math.cos(startRad);
        const y1 = 100 + 80 * Math.sin(startRad);
        const x2 = 100 + 80 * Math.cos(endRad);
        const y2 = 100 + 80 * Math.sin(endRad);
        
        const pathD = `M 100 100 L ${x1} ${y1} A 80 80 0 ${largeArc} 1 ${x2} ${y2} Z`;
        
        return (
          <path key={i} d={pathD} fill={d.color} stroke="white" strokeWidth="2">
            <title>{d.name}: ¥{Math.round(d.value).toLocaleString()} ({(percentage * 100).toFixed(1)}%)</title>
          </path>
        );
      });

      return (
        <div className="flex items-center gap-4">
          <svg width="200" height="200" viewBox="0 0 200 200">
            {paths}
            <circle cx="100" cy="100" r="50" fill="white" />
          </svg>
          <div className="space-y-2">
            {data.map((d, i) => (
              <div key={i} className="flex items-center gap-2 text-sm">
                <div className="w-3 h-3 rounded-full" style={{ backgroundColor: d.color }}></div>
                <span className="text-slate-600">{d.name}</span>
                <span className="font-medium">{(d.value / total * 100).toFixed(0)}%</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ========== シンプルな折れ線グラフコンポーネント ==========
    function SimpleLineChart({ data }) {
      if (data.length === 0) {
        return (
          <div className="h-64 flex items-center justify-center text-slate-500">
            <div className="text-center">
              <p className="mb-2">履歴データがありません</p>
              <p className="text-sm">「💾 今日のデータを保存」でデータを保存してください</p>
            </div>
          </div>
        );
      }
      
      // 1件の場合は単一ポイント表示
      if (data.length === 1) {
        const d = data[0];
        return (
          <div className="h-64 flex items-center justify-center">
            <div className="text-center">
              <p className="text-4xl font-bold text-blue-600">¥{Math.round(d.value * 10000).toLocaleString()}</p>
              <p className="text-slate-500 mt-2">{d.date}</p>
              <p className="text-sm text-slate-400 mt-1">データが増えるとグラフが表示されます</p>
            </div>
          </div>
        );
      }

      const values = data.map(d => d.value);
      const maxVal = Math.max(...values);
      const minVal = Math.min(...values);
      const range = maxVal - minVal || 1;
      const padding = range * 0.1;

      const width = 500;
      const height = 200;
      const marginLeft = 50;
      const marginBottom = 30;

      const points = data.map((d, i) => {
        const x = marginLeft + (i / (data.length - 1)) * (width - marginLeft - 20);
        const y = height - marginBottom - ((d.value - minVal + padding) / (range + padding * 2)) * (height - marginBottom - 20);
        return { x, y, ...d };
      });

      const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

      return (
        <svg width="100%" height="250" viewBox={`0 0 ${width} ${height + 20}`} className="overflow-visible">
          {/* グリッド線 */}
          {[0, 1, 2, 3, 4].map(i => {
            const y = 20 + (i / 4) * (height - marginBottom - 20);
            const val = maxVal + padding - (i / 4) * (range + padding * 2);
            return (
              <g key={i}>
                <line x1={marginLeft} y1={y} x2={width - 20} y2={y} stroke="#E2E8F0" strokeDasharray="3 3" />
                <text x={marginLeft - 5} y={y + 4} textAnchor="end" fill="#94A3B8" fontSize="10">{Math.round(val)}万</text>
              </g>
            );
          })}
          
          {/* 折れ線 */}
          <path d={pathD} fill="none" stroke="#3B82F6" strokeWidth="2" />
          
          {/* データポイント */}
          {points.map((p, i) => (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="4" fill="#3B82F6" />
              {i % Math.ceil(data.length / 6) === 0 && (
                <text x={p.x} y={height - 10} textAnchor="middle" fill="#94A3B8" fontSize="10">{p.date}</text>
              )}
            </g>
          ))}
        </svg>
      );
    }

    // ========== メインコンポーネント ==========
    function App() {
      const [usStocks, setUSStocks] = useState([]);
      const [jpStocks, setJPStocks] = useState([]);
      const [funds, setFunds] = useState([]);
      const [foreignCash, setForeignCash] = useState([]);
      const [exchangeRate, setExchangeRate] = useState(158);
      const [isDragging, setIsDragging] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');
      const [reminderDays, setReminderDays] = useState(3);
      const [history, setHistory] = useState([]);
      const [loadedFiles, setLoadedFiles] = useState([]);
      
      // 決算日データ（APIから取得）
      const [earningsData, setEarningsData] = useState({});
      const [earningsLoading, setEarningsLoading] = useState(false);
      
      // ユーザー管理
      const [currentUser, setCurrentUser] = useState('default');
      const [users, setUsers] = useState(['default']);

                      </div>
                    )}

                    {foreignCash.length > 0 && (
                      <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
                        <div className="p-4 border-b border-slate-200 bg-amber-50">
                          <h3 className="font-bold text-amber-800">💰 外貨預り金（{foreignCash.length}通貨）</h3>
                        </div>
                        <div className="divide-y divide-slate-100">
                          {foreignCash.map((cash, i) => (
                            <div key={i} className="p-4 flex items-center justify-between">
                              <div>
                                <p className="font-bold text-slate-800">{cash.name}</p>
                                <p className="text-xs text-slate-500">{cash.balanceLocal}</p>
                              </div>
                              <div className="text-right">
                                <p className="font-medium text-slate-800">¥{cash.value.toLocaleString()}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* AIアドバイスタブ */}
                {activeTab === 'ai' && (
                  <div className="space-y-6">
                    {/* 投資家プロファイル（シンプル版） */}
                    <div className="bg-white rounded-2xl p-6 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-800">👤 あなたの情報</h3>
                        <button onClick={saveProfile} className="text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-lg transition-colors">
                          💾 保存
                        </button>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">年齢</label>
                          <input type="text" value={profile.age} onChange={e => setProfile({...profile, age: e.target.value})} placeholder="例: 35歳" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">投資目的</label>
                          <select value={profile.purpose} onChange={e => setProfile({...profile, purpose: e.target.value})} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <option>老後資金</option>
                            <option>住宅購入</option>
                            <option>教育資金</option>
                            <option>FIRE・早期退職</option>
                            <option>資産形成</option>
                            <option>その他</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">リスク許容度</label>
                          <select value={profile.riskTolerance} onChange={e => setProfile({...profile, riskTolerance: e.target.value})} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <option value="低">低（-10%で不安）</option>
                            <option value="中">中（-20%まで耐えられる）</option>
                            <option value="高">高（-30%以上でも継続）</option>
                          </select>
                        </div>
                      </div>
                      <div className="mt-4">
                        <label className="block text-sm text-slate-600 mb-1">質問・相談したいこと</label>
                        <textarea value={profile.concerns} onChange={e => setProfile({...profile, concerns: e.target.value})} placeholder="例: 米国株比率が高すぎる？ リバランスのタイミングは？" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm h-20 resize-none" />
                      </div>
                    </div>

                    {/* アドバイスタイプ選択 */}
                    <div className="bg-white rounded-2xl p-6 shadow-sm">
                      <h3 className="font-bold text-slate-800 mb-4">📋 アドバイスの種類</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {[
                          { id: 'short', label: '📅 短期', desc: '1ヶ月以内' },
                          { id: 'medium', label: '📆 中期', desc: '3〜6ヶ月' },
                          { id: 'long', label: '📈 長期', desc: '1年以上' },
                          { id: 'balanced', label: '⚖️ 総合', desc: '全期間バランス' },
                        ].map(type => (
                          <button
                            key={type.id}
                            onClick={() => setAdviceType(type.id)}
                            className={`p-4 rounded-xl border-2 transition-all text-left ${adviceType === type.id ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-slate-300'}`}
                          >
                            <div className="font-medium text-slate-800">{type.label}</div>
                            <div className="text-xs text-slate-500">{type.desc}</div>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 生成プロンプト */}
                    <div className="bg-white rounded-2xl p-6 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-800">📤 AIに送るプロンプト</h3>
                        <button
                          onClick={() => {
                            const prompt = generateAIPrompt();
                            navigator.clipboard.writeText(prompt);
                            alert('クリップボードにコピーしました！\n\nClaude、ChatGPT、Geminiなどに貼り付けてください。');
                          }}
                          className="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25"
                        >
                          📋 コピーしてAIに質問
                        </button>
                      </div>
                      <div className="bg-slate-50 rounded-lg p-4 max-h-96 overflow-y-auto">
                        <pre className="text-xs text-slate-700 whitespace-pre-wrap font-mono">{generateAIPrompt()}</pre>
                      </div>
                      <div className="mt-4 flex gap-2 flex-wrap">
                        <a href="https://claude.ai" target="_blank" rel="noopener noreferrer" className="text-xs bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full hover:bg-orange-200 transition-colors">🟠 Claude で開く</a>
                        <a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer" className="text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-full hover:bg-emerald-200 transition-colors">🟢 ChatGPT で開く</a>
                        <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full hover:bg-blue-200 transition-colors">🔵 Gemini で開く</a>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}

            {!hasData && (
              <div className="bg-white rounded-2xl p-8 shadow-sm">
                <h3 className="font-bold text-slate-800 mb-4">📖 使い方</h3>
                <ol className="space-y-3 text-sm text-slate-600">
                  <li className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-bold">1</span><span>楽天証券にログイン → 「保有商品一覧」を開く</span></li>
                  <li className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-bold">2</span><span>「米国株式」「日本株式」「投資信託」「外貨預り金」それぞれで「CSV保存」</span></li>
                  <li className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-bold">3</span><span>ダウンロードしたCSVをまとめて上のエリアにドラッグ&ドロップ</span></li>
                  <li className="flex gap-3"><span className="flex-shrink-0 w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-bold">4</span><span>次回アクセス時は自動でデータが復元されます</span></li>
                </ol>
                <div className="mt-6 p-4 bg-green-50 rounded-lg">
                  <p className="text-sm text-green-700">✅ <strong>自動保存</strong>：CSV読み込み後、自動でブラウザに保存されます。次回アクセス時に自動復元！</p>
                </div>
                <div className="mt-3 p-4 bg-amber-50 rounded-lg">
                  <p className="text-sm text-amber-700">💡 <strong>バックアップ</strong>：「保有一覧」タブからバックアップをダウンロードできます（PC移行時などに便利）</p>
                </div>
              </div>
            )}
          </main>

          <footer className="bg-white border-t border-slate-200 mt-8">
            <div className="max-w-6xl mx-auto px-4 py-4 text-center text-xs text-slate-500">
              <p>楽天証券対応 資産管理＆決算カレンダー v6.2.0</p>
              <p className="mt-1">🔒 すべてのデータはブラウザ内で処理されます（サーバー送信なし）</p>
            </div>
          </footer>
        </div>
      );
    }

    // Reactアプリをマウント
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
